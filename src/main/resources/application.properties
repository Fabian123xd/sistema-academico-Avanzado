# MySQL datasource - ajusta usuario/contrasena/host/puerto segun tu entorno
spring.datasource.url=jdbc:mysql://localhost:3306/sistema_academico?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate - el esquema lo crea Flyway, Hibernate solo valida
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
# Se deja en true para simplificar la serializacion de relaciones LAZY en las respuestas JSON
spring.jpa.open-in-view=true

# Flyway - migraciones versionadas de la base de datos
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Puerto de la aplicacion
server.port=8082
spring.application.name=sistema-academico

# JWT
app.jwt.secret=${JWT_SECRET:CambiaEstaClaveSecretaPorUnaMuyLargaYSeguraEnProduccion123456789}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# CORS
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}
